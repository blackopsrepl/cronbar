name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ruby
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check tagged tree
        run: make release-check
      - name: Verify tag and build assets
        env:
          RELEASE_TAG: ${{ forgejo.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(ruby -Ilib -rcronbar -e 'print Cronbar::VERSION')"
          make dist
      - name: Publish release and assets
        env:
          RELEASE_TAG: ${{ forgejo.ref_name }}
          FORGEJO_SERVER_URL: ${{ forgejo.server_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: ruby bin/publish-forgejo
